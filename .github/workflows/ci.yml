name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Num clone limpo os tipos de rota do Next ainda não existem: sem typegen o tsc falha.
      - name: Tipos e lint
        run: npx next typegen && npx tsc --noEmit && npx eslint .
      - run: npm run build
      - name: Paridade e guarda de conteúdo
        run: node --test --test-reporter=tap tests/
      - name: Promessas do README
        run: |
          if grep -nE '/Users/|/home/|TODO|sk-[A-Za-z0-9]|danielvmacedog1@' README.md; then exit 1; fi
          test "$(grep -c '```mermaid' README.md)" -ge 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Publicar na Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: deploy
